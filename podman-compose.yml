version: "3"

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: scnet
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: scnet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scnet -d scnet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Containerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "8080:8080"
      - "51820:51820/udp"
      - "${SCNET_PUNCH_LISTEN_PORT:-51280}:${SCNET_PUNCH_LISTEN_PORT:-51280}/udp"
    environment:
      SCNET_WG_PRIVATE_KEY: ${SCNET_WG_PRIVATE_KEY}
      SCNET_JWT_SECRET: ${SCNET_JWT_SECRET}
      SCNET_DB_PASSWORD: ${DB_PASSWORD}
      SCNET_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SCNET_DISCOVERY_ENABLED: ${SCNET_DISCOVERY_ENABLED:-false}
      SCNET_DISCOVERY_URL: ${SCNET_DISCOVERY_URL:-}
      SCNET_DISCOVERY_API_ADDR: ${SCNET_DISCOVERY_API_ADDR:-}
      SCNET_WG_ENDPOINT: ${SCNET_WG_ENDPOINT:-}
      SCNET_PUNCH_ENABLED: ${SCNET_PUNCH_ENABLED:-false}
      SCNET_PUNCH_LISTEN_PORT: ${SCNET_PUNCH_LISTEN_PORT:-51280}
      SCNET_PUNCH_WG_HOST: ${SCNET_PUNCH_WG_HOST:-127.0.0.1}
      SCNET_PUNCH_WG_PORT: ${SCNET_PUNCH_WG_PORT:-51820}
      SCNET_STUN_SERVERS: ${SCNET_STUN_SERVERS:-}
      SCNET_PUNCH_PROBE_TIMEOUT_SECONDS: ${SCNET_PUNCH_PROBE_TIMEOUT_SECONDS:-5}
      SCNET_PUNCH_KEEPALIVE_SECONDS: ${SCNET_PUNCH_KEEPALIVE_SECONDS:-20}
      SCNET_AGENT_TOKEN: ${SCNET_AGENT_TOKEN:-}
    volumes:
      - ./config.yaml:/etc/scnet/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  relay-agent:
    profiles:
      - relay
    build:
      context: .
      dockerfile: Containerfile
    entrypoint: ["/usr/local/bin/scnet-relay-agent"]
    environment:
      SCNET_AGENT_URL: ${SCNET_AGENT_URL}
      SCNET_AGENT_TOKEN: ${SCNET_AGENT_TOKEN}
      SCNET_AGENT_ID: ${SCNET_AGENT_ID:-shuosc-network-podman}
      SCNET_AGENT_BACKEND_URL: ${SCNET_AGENT_BACKEND_URL:-http://server:8080}
      SCNET_AGENT_PING_INTERVAL_MS: ${SCNET_AGENT_PING_INTERVAL_MS:-15000}
      SCNET_AGENT_REQUEST_TIMEOUT_MS: ${SCNET_AGENT_REQUEST_TIMEOUT_MS:-20000}
      SCNET_AGENT_RECONNECT_DELAY_MS: ${SCNET_AGENT_RECONNECT_DELAY_MS:-3000}
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
    name: shuosc_network_pgdata
